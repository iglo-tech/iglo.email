name: Release

# A pushed v* tag builds and verifies the executable on each architecture's native runner (Linux
# x86-64 and Linux arm64, D89), publishes a draft release with both, and pushes one multi-arch
# image to GHCR that only wraps those two verified executables. A manual run from any ref is a dry
# run of the same build, verification and image build, and publishes and pushes nothing.
# package.json must already hold the tag's version. Tag names reach shell only as environment
# variables.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Refuse tags with build metadata
        if: github.ref_type == 'tag'
        run: |
          case "$GITHUB_REF_NAME" in
            *+*)
              echo "Tag '$GITHUB_REF_NAME' contains '+' (build metadata), which is not a valid Docker tag" >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      # These use the file check built. contract:normal would rebuild it first.
      - run: bun run release:verify
      - run: bun test/contract/cli.ts owned production
      - run: bun run release:package
      - name: Keep the files for the later jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
      - name: Check each architecture and write one SHA256SUMS
        run: |
          set -eu
          for arch in x64 arm64; do
            (cd "release-$arch" && sha256sum --check --strict SHA256SUMS)
          done
          # The notices and the license do not depend on the architecture.
          cmp release-x64/LICENSE release-arm64/LICENSE
          cmp release-x64/THIRD-PARTY-NOTICES.txt release-arm64/THIRD-PARTY-NOTICES.txt
          mkdir release
          cp release-x64/iglo.email-linux-x64 release-arm64/iglo.email-linux-arm64 \
            release-x64/LICENSE release-x64/THIRD-PARTY-NOTICES.txt release/
          cd release
          sha256sum iglo.email-linux-x64 iglo.email-linux-arm64 LICENSE THIRD-PARTY-NOTICES.txt > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Create the draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${flags[@]}" \
            iglo.email-linux-x64 iglo.email-linux-arm64 LICENSE THIRD-PARTY-NOTICES.txt SHA256SUMS

  # One image for linux/amd64 and linux/arm64 from the two verified executables. The Dockerfile has
  # no RUN on the target platform, so no emulation is needed. Only this job may write packages.
  image:
    needs: [build, publish]
    if: |
      !failure() && !cancelled() &&
      needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
      - name: Place the executables for the Dockerfile
        run: |
          set -eu
          for pair in x64:amd64 arm64:arm64; do
            arch=${pair%%:*}; target=${pair##*:}
            (cd "release/release-$arch" && sha256sum --check --strict SHA256SUMS)
            install -D -m 0755 "release/release-$arch/iglo.email-linux-$arch" "dist/docker/$target/iglo.email"
          done
      - name: Name the image
        id: image
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          if [ "$PUSH" != "true" ]; then
            printf 'tags=iglo.email:dry-run\n' >> "$GITHUB_OUTPUT"
            printf 'version=dry-run\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$version" in
            *+*)
              echo "Tag '$GITHUB_REF_NAME' contains '+' (build metadata), which is not a valid Docker tag" >&2
              exit 1
              ;;
          esac
          tags="ghcr.io/iglo-tech/iglo.email:$version"
          case "$version" in
            *-*) ;;
            *) tags="$tags,ghcr.io/iglo-tech/iglo.email:latest" ;;
          esac
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: false

  # Runs the image as a user would, on each architecture's native runner, on every run, dry or not.
  # It builds that platform's image from the same verified executable and loads it locally, so
  # nothing is pushed, no emulation is needed and no package permission is granted. It depends on
  # build only: a skipped image job must not skip this check.
  image-smoke:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.arch }}
          path: release-${{ matrix.arch }}
      - name: Place the executable for the Dockerfile
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          (cd "release-$ARCH" && sha256sum --check --strict SHA256SUMS)
          install -D -m 0755 "release-$ARCH/iglo.email-linux-$ARCH" "dist/docker/$TARGET/iglo.email"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.target }}
          load: true
          push: false
          tags: iglo.email:smoke
          build-args: |
            REVISION=${{ github.sha }}
          provenance: false
      - name: Run --version and check /health
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          want=$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' package.json)
          got=$(docker run --rm iglo.email:smoke --version)
          if [ "$got" != "$want" ]; then
            echo "$TARGET image printed '$got' for --version, want '$want'" >&2
            exit 1
          fi
          docker run -d --name iglo-smoke -p 127.0.0.1:9000:9000 \
            -e IGLO_EMAIL_ROOT_URL=http://127.0.0.1:9000 iglo.email:smoke
          body=
          for _ in $(seq 1 60); do
            body=$(curl -fsS http://127.0.0.1:9000/health 2>/dev/null || true)
            if [ -n "$body" ]; then break; fi
            sleep 1
          done
          if [ "$body" != '{"data":true}' ]; then
            docker logs iglo-smoke >&2 || true
            echo "$TARGET image did not answer /health with {\"data\":true}" >&2
            exit 1
          fi
      - name: Remove the smoke container
        if: always()
        run: docker rm -f -v iglo-smoke || true
