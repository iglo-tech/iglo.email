name: CI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run ui:verify
      - name: Configure and probe isolated fixture on disposable runner
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          # This applies only to this disposable GitHub-hosted test runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --ro-bind / / --proc /proc --dev /dev /usr/bin/true
      - run: bun run templates:compiled
      - run: bun run contract:templates
      - run: bun run contract:normal
      - run: bun run contract:auth
      - run: bun run contract:roles
      - run: bun run contract:lists
      - run: bun run contract:subscribers
      - run: bun run contract:settings
      - run: bun run contract:sends
      - run: bun run contract:fixture
      - run: bun run contract:messaging
      - run: bun run messaging:fixture

  reference-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Configure and probe isolated fixture on disposable runner
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          # This applies only to this disposable GitHub-hosted test runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --ro-bind / / --proc /proc --dev /dev /usr/bin/true
      - run: bun run templates:compiled
      - run: bun run reference:prepare
      - run: bun run reference:smoke
      - run: bun run contract:reference
      - run: bun run reference:run -- bun test/contract/auth.ts reference
      - run: bun run contract:roles:reference
      - run: bun run contract:lists:reference
      - run: bun run contract:subscribers:reference
      - run: bun run contract:settings:reference
      - run: bun run contract:messaging:reference
      - run: bun run contract:templates:reference
      - run: bun run sends:crash
      - run: bun run sends:proofs
      - run: bun run sends:production
      - run: bun run messaging:faults
      - run: bun run messaging:auth
      - run: bun run messaging:tls
      - run: bun run messaging:corpus
      - run: bun run messaging:routing
      - run: bun run server:reference
      - run: bun run reference:run -- bun -e 'if (!process.env.REFERENCE_URL) process.exit(1)'
